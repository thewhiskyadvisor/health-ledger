  :root{
    --ink:#384a53;       /* deep slate — primary text / workout accent */
    --rust:#7d4125;      /* morning accent */
    --taupe:#96836e;     /* drinks accent */
    --grey:#75736e;      /* nightly accent / muted text */
    --oura:#4a7c74;      /* Oura accent — muted slate-teal */
    --journal:#5b6f8c;   /* Journal accent — slate blue */
    --white:#ffffff;
    --line: rgba(56,74,83,0.28);        /* subtly darker for a more framed feel */
    --line-soft: rgba(56,74,83,0.15);   /* original lighter line, kept for inner dashes */
    --tint: rgba(56,74,83,0.045);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);}
  body{
    font-family:'Poppins',sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--white);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .script{ font-family:'Hamillton One', cursive; }

  /* ---------- SPLASH ---------- */
  #splash{
    position:fixed; inset:0; z-index:50;
    background: radial-gradient(120% 100% at 50% 0%, #445A65 0%, var(--ink) 55%, #232F36 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--white);
    cursor:pointer;
    transition:opacity .6s ease, transform .6s ease;
  }
  #splash.hide{ opacity:0; transform:translateY(-16px); pointer-events:none; }
  .splash-eyebrow{
    font-family:'Poppins',sans-serif;
    letter-spacing:.28em;
    font-size:11px;
    font-weight:500;
    color:#C9A084;
    text-transform:uppercase;
    margin-bottom:10px;
    opacity:0;
    animation: fadeUp .7s ease forwards .15s;
  }
  .splash-title{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:34px;
    line-height:1.25;
    text-align:center;
    max-width:340px;
    opacity:0;
    animation: fadeUp .8s ease forwards .35s;
  }
  .splash-sub{
    font-family:'Hamillton One', cursive;
    font-weight:400;
    font-size:22px;
    letter-spacing:.02em;
    color:#C7D0D4;
    margin-top:10px;
    opacity:0;
    animation: fadeUp .8s ease forwards .55s;
  }
  .gauge{
    margin-top:46px;
    width:180px; height:3px;
    background:rgba(255,255,255,.15);
    border-radius:2px;
    overflow:hidden;
    opacity:0;
    animation: fadeUp .6s ease forwards .8s;
  }
  .gauge-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--rust), #C7794C);
    animation: fill 1.5s ease-out forwards 1s;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fill{ from{width:0%;} to{width:100%;} }

  /* ---------- HEADER ---------- */
  header.topbar{
    padding:20px 20px 14px;
    border-bottom:1px solid var(--line);
    background:var(--white);
    position:sticky; top:0; z-index:10;
  }
  .topbar-row{ display:flex; align-items:baseline; justify-content:space-between; }
  .brand{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    line-height:1;
  }
  .brand span{ color:var(--rust); }
  .date-badge{
    font-family:'Poppins',sans-serif;
    font-size:11px;
    font-weight:500;
    letter-spacing:.03em;
    color:var(--grey);
    background:var(--tint);
    border:1px solid var(--line);
    padding:4px 9px;
    border-radius:3px;
  }
  .section-label{
    margin-top:12px;
    font-family:'Poppins',sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--rust);
  }

  /* ---------- SUB TABS ---------- */
  .subtabs{
    display:flex; gap:6px;
    padding:14px 16px 0;
    overflow-x:auto;
    position:relative;
    z-index:2;
  }
  .subtab{
    flex:1;
    text-align:center;
    padding:9px 4px 8px;
    border-radius:6px 6px 0 0;
    font-family:'Poppins',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--grey);
    background:var(--tint);
    border:1px solid var(--line);
    border-bottom:none;
    cursor:pointer;
    white-space:nowrap;
    transition: transform .15s ease, background .15s ease;
    position:relative; top:1px;
  }
  .subtab.active{
    background:var(--white);
    color:var(--ink);
    transform:translateY(-2px);
    box-shadow: 0 -2px 6px rgba(0,0,0,.05);
  }
  .subtab.active[data-accent="morning"]{ border-top:3px solid var(--rust); }
  .subtab.active[data-accent="workout"]{ border-top:3px solid var(--ink); }
  .subtab.active[data-accent="nightly"]{ border-top:3px solid var(--grey); }
  .subtab.active[data-accent="drinks"]{ border-top:3px solid var(--taupe); }
  .subtab.active[data-accent="oura"]{ border-top:3px solid var(--oura); }
  .subtab.active[data-accent="journal"]{ border-top:3px solid var(--journal); }

  /* ---------- CONTENT ---------- */
  main{
    flex:1;
    background:var(--white);
    padding:20px 18px 100px;
    border-top:1px solid var(--line);
    margin-top:-1px;      /* sits flush under the active tab, no visible seam */
    position:relative;
    z-index:1;
  }

  .ticket{
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px 18px 20px;
    position:relative;
    margin-bottom:16px;
  }
  .ticket::before{
    content:'';
    position:absolute; left:14px; right:14px; top:44px;
    border-top:1px dashed var(--line-soft);
  }
  .ticket-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:22px;
  }
  .ticket-title{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:19px;
  }
  .ticket-seal{
    font-family:'Poppins',sans-serif;
    font-size:10px;
    font-weight:500;
    text-align:right;
    color:var(--grey);
    line-height:1.5;
  }
  .ticket-seal b{ color:var(--ink); }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-family:'Poppins',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--grey);
    margin-bottom:7px;
  }
  .field label .req{ color:var(--rust); margin-left:3px; }
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%;
    font-family:'Poppins',sans-serif;
    font-size:15px;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--white);
    color:var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    outline:none; border-color:var(--rust);
    box-shadow:0 0 0 3px rgba(125,65,37,.12);
  }
  .field textarea{ min-height:60px; resize:vertical; }
  .other-input{ margin-top:8px; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:8px 13px;
    border:1px solid var(--line);
    border-radius:20px;
    font-size:13px;
    font-family:'Poppins',sans-serif;
    color:var(--grey);
    cursor:pointer;
    background:var(--white);
    user-select:none;
    transition: all .12s ease;
  }
  .chip.selected{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--white);
  }
  .chip.selected[data-accent="morning"]{ background:var(--rust); border-color:var(--rust); }
  .chip.selected[data-accent="workout"]{ background:var(--ink); border-color:var(--ink); }
  .chip.selected[data-accent="nightly"]{ background:var(--grey); border-color:var(--grey); }
  .chip.selected[data-accent="drinks"]{ background:var(--taupe); border-color:var(--taupe); }
  .chip.selected[data-accent="journal"]{ background:var(--journal); border-color:var(--journal); }

  .hint{ font-size:12px; color:var(--grey); margin-top:6px; font-family:'Poppins',sans-serif;}

  .submit-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:6px;
    font-family:'Poppins',sans-serif;
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--white);
    cursor:pointer;
    margin-top:6px;
    transition: opacity .15s ease, transform .1s ease;
  }
  .submit-btn:active{ transform:scale(.98); }
  .submit-btn[data-accent="morning"]{ background:var(--rust); }
  .submit-btn[data-accent="workout"]{ background:var(--ink); }
  .submit-btn[data-accent="nightly"]{ background:var(--grey); }
  .submit-btn[data-accent="drinks"]{ background:var(--taupe); }
  .submit-btn[data-accent="journal"]{ background:var(--journal); }
  .submit-btn:disabled{ opacity:.55; cursor:default; }

  .toast{
    position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--white);
    font-family:'Poppins',sans-serif; font-size:12px; font-weight:500;
    padding:10px 18px; border-radius:20px;
    opacity:0; transition: all .3s ease; pointer-events:none; z-index:40;
    max-width:85%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- VIEW TABLES ---------- */
  .row-card{
    background:#fff;
    border:1px solid var(--line);
    border-left:3px solid var(--rust);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .row-card[data-accent="workout"]{ border-left-color:var(--ink); }

  /* ---------- OURA THREE-TIER CARD ---------- */

  .oura-chev{ color:var(--grey); font-size:13px; width:13px; text-align:center; transition:transform .2s ease; }

  .oura-more{

  .empty-state, .loading-state, .error-state{

  /* ---------- BOTTOM NAV ---------- */
  nav.bottomnav{
    position:fixed; bottom:0; left:0; right:0;
    max-width:520px; margin:0 auto;

  .navbtn.active{ color:var(--white); border-top-color:var(--rust); }
</style>
</head>
<body>

<div id="splash" onclick="dismissSplash()">
  <div class="splash-eyebrow">A Personal Ledger</div>
  <div class="splash-title">Uday's Health<br/>&amp; Wellbeing</div>
  <div class="splash-sub">measure what matters</div>
  <div class="gauge"><div class="gauge-fill"></div></div>
</div>

<div id="app">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">Uday's <span>Ledger</span></div>
      <div class="date-badge" id="dateBadge">—</div>
    </div>
    <div class="section-label" id="sectionLabel">LOG</div>
  </header>

  <div class="subtabs" id="subtabs"></div>
  <main id="mainContent"></main>

  <nav class="bottomnav">
    <div class="navbtn active" id="navLog" onclick="setSection('log')">Log</div>
    <div class="navbtn" id="navView" onclick="setSection('view')">View</div>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const SHEET_ID = "1oETgpMsgv8mxFxgAp9FDLFPyTQGmd7KJKyzVE7fC70k";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiiqNefkahB5jqL0YnZz_ZlZ580J0OH7lVc9jFNOETpHblvr1dJBaMkv36gSlucd0c/exec";

const LOG_TABS  = ["morning","workout","nightly","drinks","journal"];
const VIEW_TABS = ["oura","morning","workout","nightly","drinks","journal"];
const TAB_META = {
  morning:  { label:"Morning",  accent:"morning",  sheetName:"Morning" },
  workout:  { label:"Workout",  accent:"workout",  sheetName:"Workout" },
  nightly:  { label:"Nightly",  accent:"nightly",  sheetName:"Nightly" },
  drinks:   { label:"Drinks",   accent:"drinks",   sheetName:"Drinks" },
  oura:     { label:"Oura",     accent:"oura",     sheetName:"Oura" },
  journal:  { label:"Journal",  accent:"journal",  sheetName:"Daily Journal" },
};

/* =========================================================
   FORM SCHEMAS — mirrors the 4 Google Forms field-for-field
   allowOther:true fields let you pick "Other" and type free text,
   which is what actually gets submitted in place of the word "Other".
   ========================================================= */
const FORM_SCHEMAS = {
  morning: {
    title: "Morning",
    fields: [
      { key:"Scale", label:"Scale", type:"chips", options:["Home","Other"], required:true, allowOther:true },
      { key:"Weight (Kg)", label:"Weight (Kg)", type:"numOrNA", required:true, step:"0.1", hint:"No scale this morning? Tick the box to log NA instead of 0." },
      { key:"Conditions", label:"Conditions", type:"chips", options:["Fasted Post-Loo","Pre-Loo","Other"], required:true, allowOther:true },
      { key:"How Are You Feeling Today?", label:"How are you feeling today?", type:"text", required:true },
      { key:"Note (Optional)", label:"Note", type:"textarea", required:false },
    ]
  },
  workout: {
    title: "Workout",
    fields: [
      { key:"1. Type", label:"Type", type:"chips", options:["Strength (Fame Club)","Zone - 2","Badminton","Other"], required:true, allowOther:true },
      { key:"2. Duration (min)", label:"Duration (min)", type:"number", required:true },
      { key:"3. Avg HR", label:"Avg HR", type:"number", required:true },
      { key:"4. Max HR", label:"Max HR", type:"number", required:true },
      { key:"5. Time in Zone 2 (min)", label:"Time in Zone 2 (min)", type:"number", required:false, hint:"Leave blank if N/A" },
      { key:"6. Calories", label:"Calories", type:"number", required:true, hint:"Oura = active cal, Polar = total. Stay consistent, Oura primary." },
      { key:"7. Source", label:"Source", type:"chips", options:["Oura","Polar"], required:true },
      { key:"Zone 2 Work Out Settings", label:"Zone 2 workout settings", type:"text", required:false, hint:'e.g. Treadmill; Speed 4 to 4.5 kph; Incline 1 to 3' },
      { key:"Note (Optional)", label:"Note", type:"textarea", required:false },
    ]
  },
  nightly: {
    title: "Nightly",
    fields: [
      { key:"Supplements", label:"Supplements", type:"multichip", options:["Vit C","Berberine (Breakfast)","Berberine (Dinner)","Creatine","Protein","Magnesium","Vit D (Fortnightly)","Activated Charcoal"], required:true },
      { key:"Hydration (ml)", label:"Hydration (ml)", type:"number", required:true },
      { key:"Other Fluids (ml)", label:"Other fluids", type:"text", required:false, hint:"e.g. Water For Protein Mixing- 600ml" },
      { key:"Any Alcohol Today?", label:"Any alcohol today?", type:"chips", options:["Yes","No"], required:true },
      { key:"Context", label:"Context", type:"chips", options:["Solo - Home","Friends - Home","Friends - Place","Family - Home","Club","Bar","Gandhipuram","Party","Work","Traveling - Work","Holiday","Other"], required:false, allowOther:true, showIf:{key:"Any Alcohol Today?", equals:"Yes"} },
      { key:"Drinking Session Duration", label:"Drinking session duration", type:"text", required:false, hint:"e.g. 180 mins (8PM - 11PM)", showIf:{key:"Any Alcohol Today?", equals:"Yes"} },
      { key:"Location", label:"Location", type:"chips", options:["Coimbatore","Traveling","Coimbatore - Traveling earlier in the day","Traveling - Coimbatore earlier in the day"], required:true },
      { key:"Any other medication", label:"Any other medication", type:"text", required:false },
      { key:"Note (Optional)", label:"Note", type:"textarea", required:false },
    ]
  },
  drinks: {
    title: "Drinks",
    fields: [
      { key:"1. Drink Type", label:"Drink Type", type:"chips", options:["Whisky","Bourbon","Rye","Gin","Tequila","Mezcal","Cocktail","Rum","Cognac","Beer","Other"], required:true, allowOther:true },
      { key:"1b. Drink / Brand", label:"Drink / Brand", type:"text", required:false, hint:"e.g. Hoegaarden, Paul John, Hennessy" },
      { key:"2. ABV", label:"ABV", type:"number", required:true },
      { key:"3. Quantity (ml)", label:"Quantity (ml)", type:"number", required:true },
      { key:"4. Number of drinks", label:"Number of drinks", type:"number", required:true },
      { key:"5. Accompaniment", label:"Accompaniment", type:"chips", options:["Neat","Water","Soda","Ice","Cocktail","Other"], required:true, allowOther:true },
      { key:"6. Notes (Optional)", label:"Notes", type:"textarea", required:false },
    ]
  },
  journal: {
    title: "Daily Journal",
    fields: [
      { key:"Entry", label:"Today", type:"textarea", required:true, hint:"Write freely about your day — as long or short as you want." },
    ]
  }
};

/* =========================================================
   STATE
   ========================================================= */
let state = {
  section: "log",
  logTab: "morning",
  viewTab: "oura",
  formValues: { morning:{}, workout:{}, nightly:{}, drinks:{}, journal:{} },
  viewCache: {},
  ouraExpanded: {},      // day -> true when a card is open
  ouraDeepOpen: {},      // day -> true when "all raw fields" is open
  ouraDefaultApplied: false,  // ensures the most-recent-day auto-expand happens only once
};

function dismissSplash(){
  document.getElementById('splash').classList.add('hide');
  setTimeout(()=>document.getElementById('splash').remove(), 650);
}
setTimeout(()=>{ if(document.getElementById('splash')) dismissSplash(); }, 3400);

function fmtDate(){
  const d = new Date();
  return d.toLocaleDateString('en-GB',{weekday:'short', day:'2-digit', month:'short'});
}
document.getElementById('dateBadge').textContent = fmtDate();

function setSection(section){
  state.section = section;
  document.getElementById('navLog').classList.toggle('active', section==='log');
  document.getElementById('navView').classList.toggle('active', section==='view');
  document.getElementById('sectionLabel').textContent = section.toUpperCase();
  renderSubtabs();
  renderContent();
}

function currentTab(){
  return state.section === 'log' ? state.logTab : state.viewTab;
}
function setTab(tab){
  if(state.section==='log') state.logTab = tab; else state.viewTab = tab;
  renderSubtabs();
  renderContent();
}

function renderSubtabs(){
  const c = document.getElementById('subtabs');
  const list = state.section === 'log' ? LOG_TABS : VIEW_TABS;
  c.innerHTML = list.map(t=>{
    const meta = TAB_META[t];
    const active = currentTab()===t;
    return `<div class="subtab ${active?'active':''}" data-accent="${meta.accent}" onclick="setTab('${t}')">${meta.label}</div>`;
  }).join('');
}

/* =========================================================
   RENDER: LOG FORMS
   ========================================================= */
function renderContent(){
  const main = document.getElementById('mainContent');
  if(state.section === 'log'){
    main.innerHTML = renderForm(currentTab());
  } else {
    main.innerHTML = `<div class="loading-state">Loading ${TAB_META[currentTab()].label.toLowerCase()} entries…</div>`;
    loadViewTab(currentTab());
  }
}

function renderForm(tab){
  const schema = FORM_SCHEMAS[tab];
  const accent = TAB_META[tab].accent;
  const vals = state.formValues[tab];
  const fieldsHtml = schema.fields.map(f=>{
    if(f.showIf && vals[f.showIf.key] !== f.showIf.equals) return '';
    return renderField(tab, f, vals[f.key]);
  }).join('');

  return `
    <div class="ticket">
      <div class="ticket-head">
        <div class="ticket-title">${schema.title}</div>
      </div>
      <form onsubmit="return submitForm(event,'${tab}')">
        ${fieldsHtml}
        <button type="submit" class="submit-btn" data-accent="${accent}" id="submitBtn-${tab}">Save entry</button>
      </form>
    </div>
  `;
}

function renderField(tab, f, val){
  const reqMark = f.required ? '<span class="req">*</span>' : '';
  const hint = f.hint ? `<div class="hint">${f.hint}</div>` : '';
  let inner = '';

  if(f.type === 'text'){
    inner = `<input type="text" value="${val||''}" oninput="updateField('${tab}','${escKey(f.key)}',this.value)"/>`;
  } else if(f.type === 'number'){
    inner = `<input type="number" ${f.step?`step="${f.step}"`:''} value="${val||''}" oninput="updateField('${tab}','${escKey(f.key)}',this.value)"/>`;
  } else if(f.type === 'numOrNA'){
    const isNA = val === 'NA';
    inner = `
      <input type="number" ${f.step?`step="${f.step}"`:''} value="${isNA?'':(val||'')}" ${isNA?'disabled':''} oninput="updateField('${tab}','${escKey(f.key)}',this.value)"/>
      <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--grey);font-family:'Poppins',sans-serif;">
        <input type="checkbox" ${isNA?'checked':''} onchange="toggleNA('${tab}','${escKey(f.key)}',this.checked)"/>
        No scale this morning — log NA
      </label>`;
  } else if(f.type === 'textarea'){
    inner = `<textarea oninput="updateField('${tab}','${escKey(f.key)}',this.value)">${val||''}</textarea>`;
  } else if(f.type === 'chips'){
    inner = `<div class="chip-row">${f.options.map(o=>{
      const sel = val===o;
      return `<div class="chip ${sel?'selected':''}" data-accent="${TAB_META[tab].accent}" onclick="selectChip('${tab}','${escKey(f.key)}','${escKey(o)}', false)">${o}</div>`;
    }).join('')}</div>`;
    if(f.allowOther && val === 'Other'){
      const otherVal = state.formValues[tab][f.key+'__other'] || '';
      inner += `<div class="other-input"><input type="text" placeholder="Please specify…" value="${otherVal}" oninput="updateOther('${tab}','${escKey(f.key)}',this.value)"/></div>`;
    }
  } else if(f.type === 'multichip'){
    const selectedList = (val||'').split(',').map(s=>s.trim()).filter(Boolean);
    inner = `<div class="chip-row">${f.options.map(o=>{
      const sel = selectedList.includes(o);
      return `<div class="chip ${sel?'selected':''}" data-accent="${TAB_META[tab].accent}" onclick="selectChip('${tab}','${escKey(f.key)}','${escKey(o)}', true)">${o}</div>`;
    }).join('')}</div>`;
  }

  return `<div class="field">
    <label>${f.label}${reqMark}</label>
    ${inner}
    ${hint}
  </div>`;
}

function escKey(k){ return k.replace(/'/g,"\\'"); }

function updateField(tab, key, value){
  state.formValues[tab][key] = value;
}
function updateOther(tab, key, value){
  state.formValues[tab][key+'__other'] = value;
}
function toggleNA(tab, key, checked){
  state.formValues[tab][key] = checked ? 'NA' : '';
  renderContent();
}
function selectChip(tab, key, option, multi){
  const vals = state.formValues[tab];
  if(multi){
    let list = (vals[key]||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(list.includes(option)) list = list.filter(o=>o!==option);
    else list.push(option);
    vals[key] = list.join(', ');
  } else {
    vals[key] = option;
  }
  renderContent();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

// Resolves a field's real submitted value, swapping "Other" for the typed free text.
function resolvedValue(tab, f){
  const vals = state.formValues[tab];
  let value = vals[f.key];
  if(f.allowOther && value === 'Other'){
    const custom = (vals[f.key+'__other']||'').trim();
    if(custom) value = custom;
  }
  return value;
}

function submitForm(evt, tab){
  evt.preventDefault();
  const schema = FORM_SCHEMAS[tab];
  const vals = state.formValues[tab];
  for(const f of schema.fields){
    if(f.showIf && vals[f.showIf.key] !== f.showIf.equals) continue;
    if(!f.required) continue;
    if(!vals[f.key]){
      showToast(`Please fill in: ${f.label}`);
      return false;
    }
    if(f.allowOther && vals[f.key] === 'Other' && !(vals[f.key+'__other']||'').trim()){
      showToast(`Please specify: ${f.label}`);
      return false;
    }
  }

  const btn = document.getElementById(`submitBtn-${tab}`);
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const data = {};
  schema.fields.forEach(f=>{ data[f.key] = resolvedValue(tab, f); });
  const payload = { sheet: TAB_META[tab].sheetName, data };

  const finish = (success) => {
    btn.disabled = false;
    btn.textContent = 'Save entry';
    if(success){
      showToast(`${schema.title} entry saved ✓`);
      state.formValues[tab] = {};
      renderContent();
    } else {
      showToast(`Couldn't reach the Sheet — check setup`);
    }
  };

  if(!APPS_SCRIPT_URL){
    setTimeout(()=>{
      console.log('[local-only, no Apps Script URL set]', payload);
      showToast(`${schema.title} entry captured locally (Sheet not yet connected)`);
      state.formValues[tab] = {};
      renderContent();
      btn.disabled = false;
    }, 400);
    return false;
  }

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(()=> finish(true))
    .catch(()=> finish(true));

  return false;
}

/* =========================================================
   RENDER: VIEW TABS (read live from the Sheet via gviz)
   ========================================================= */
function loadViewTab(tab){
  const meta = TAB_META[tab];
  if(state.viewCache[tab]){
    if(tab==='oura') renderOuraTable(state.viewCache[tab]); else renderViewTable(tab, state.viewCache[tab]);
    return;
  }
  const cbName = `gviz_cb_${tab}`;
  window[cbName] = function(json){
    state.viewCache[tab] = json;
    if(state.section==='view' && currentTab()===tab){
      if(tab==='oura') renderOuraTable(json); else renderViewTable(tab, json);
    }
    document.getElementById(cbName+'_tag')?.remove();
  };
  const script = document.createElement('script');
  script.id = cbName+'_tag';
  // Oura has 600+ rows — pull only the newest 30 (column A = day) for speed.
  const query = tab==='oura' ? ';tq=' + encodeURIComponent('select * order by A desc limit 30') : '';
  script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cbName}${query}&sheet=${encodeURIComponent(meta.sheetName)}`;
  script.onerror = function(){
    const main = document.getElementById('mainContent');
    if(state.section==='view' && currentTab()===tab){
      main.innerHTML = `<div class="error-state">Couldn't load "${meta.sheetName}" from the Sheet.<br/>Check the tab name matches exactly, and that link-sharing is still on.</div>`;
    }
  };
  document.body.appendChild(script);
}

function parseGvizDate(v){
  if(typeof v !== 'string') return null;
  const m = v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
  if(!m) return v;
  const [_, y, mo, d, h=0, mi=0, s=0] = m.map(Number);
  const dt = new Date(y, mo, d, h, mi, s);
  return dt.toLocaleString('en-GB',{ day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

// Strips the leading form-order prefix ("1. ", "1b. ", "12. " etc.) from a
// raw sheet header before it's shown to the user — the numbers are only
// there to keep the Google Form field order stable, not for display.
function cleanColLabel(label){
  return (label||'').replace(/^\d+[a-zA-Z]?\.\s*/, '');
}

function renderViewTable(tab, json){
  const main = document.getElementById('mainContent');
  if(!json || !json.table || !json.table.rows || json.table.rows.length===0){
    main.innerHTML = `<div class="empty-state">No entries yet in ${TAB_META[tab].label}.</div>`;
    return;
  }
  const cols = json.table.cols.map(c=>c.label || '');
  const rows = json.table.rows.map(r => r.c.map(cell => cell ? (cell.f !== undefined ? cell.f : cell.v) : ''));

  const ordered = rows.slice().reverse();

  const timestampIdx = cols.findIndex(c=>c.toLowerCase()==='timestamp');
  const noteIdx = cols.findIndex(c=>c.toLowerCase().includes('note'));
  const entryIdx = cols.findIndex(c=>c==='Entry');

  // Guard against duplicate/repeated columns in the underlying Sheet (e.g. two
  // columns both literally named "1b. Drink / Brand") — only the first
  // occurrence of any given (cleaned) label is shown in the grid.
  const seenLabels = new Set();
  const dupeIdx = cols.map((c,i)=>{
    const clean = cleanColLabel(c);
    if(seenLabels.has(clean)) return true;
    seenLabels.add(clean);
    return false;
  });

  const cardsHtml = ordered.map(row=>{
    const ts = timestampIdx>=0 ? parseGvizDate(row[timestampIdx]) : '';
    const headline = headlineFor(tab, cols, row);
    const gridHtml = cols.map((c,i)=>{
      if(i===timestampIdx || i===noteIdx || i===entryIdx || dupeIdx[i]) return '';
      if(row[i]===''||row[i]===undefined||row[i]===null) return '';
      return `<div style="font-size:11px;color:var(--grey);">${cleanColLabel(c)}</div><div><b>${row[i]}</b></div>`;
    }).join('');
    const noteHtml = (noteIdx>=0 && row[noteIdx]) ? `<div class="row-note">"${row[noteIdx]}"</div>` : '';
    const entryHtml = (entryIdx>=0 && row[entryIdx]) ? `<div class="row-note">${row[entryIdx]}</div>` : '';
    return `
      <div class="row-card" data-accent="${TAB_META[tab].accent}">
        <div class="row-top">
          <div class="row-headline">${headline}</div>
          <div class="row-time">${ts}</div>
        </div>
        <div class="row-grid">${gridHtml}</div>
        ${noteHtml}
        ${entryHtml}
      </div>
    `;
  }).join('');

  main.innerHTML = cardsHtml;
}

function headlineFor(tab, cols, row){
  const get = (name) => {
    const i = cols.findIndex(c=>c===name);
    return i>=0 ? row[i] : '';
  };
  if(tab==='morning'){
    const w = get('Weight (Kg)');
    return (w==='NA' || w==='' || w==null) ? 'NA' : `${w} kg`;
  }
  if(tab==='workout') return get('1. Type') || 'Workout';
  if(tab==='nightly'){
    const yes = get('Any Alcohol Today?')==='Yes';
    return `<span style="color:${yes ? '#b8443a' : '#1d9e75'}">Alcohol: ${yes ? 'Yes' : 'No'}</span>`;
  }
  if(tab==='drinks'){
    const type = get('1. Drink Type') || 'Drink';
    const brand = get('1b. Drink / Brand');
    return brand ? `${type} — ${brand}` : type;
  }
  if(tab==='journal'){
    const entry = get('Entry') || '';
    return entry.length>60 ? entry.slice(0,60)+'…' : (entry || 'Journal entry');
  }
  return '';
}

/* =========================================================
   RENDER: OURA (three-tier card)
   ========================================================= */
// Which fields sit in Tier 1 (first tap) vs the deepest tier ("all raw fields").
// [label, sheetColumn, unit]. unit: ''=plain, 'hm'=minutes->Hh MM, 'pwv'=interpret, else suffix.
const OURA_T1 = [
  ["Sleep vitals", [["Lowest HR","lowest_hr","bpm"],["Avg HR","avg_hr","bpm"],["HRV","hrv","ms"]]],
  ["Sleep stages", [["Total sleep","tst","hm"],["Time in bed","tib","hm"],["Deep","deep","hm"],["REM","rem","hm"],["Light","light","hm"],["Efficiency","eff","%"]]],
  ["Sleep sub-scores", [["Deep","sc_deep_sleep",""],["REM","sc_rem_sleep",""],["Latency","sc_latency",""],["Restfulness","sc_restfulness",""],["Timing","sc_timing",""]]],
  ["Readiness contributors", [["HRV balance","rc_hrv_balance",""],["Resting HR","rc_resting_heart_rate",""]]],
  ["Activity", [["Total cal","total_cal",""],["Active cal","active_cal",""],["Steps","steps","n"]]],
  ["Stress", [["High stress","stress_high","m"],["Recovery","recov_high","m"]], "stress_sum"],
  ["Cardio", [["VO₂max","vo2",""],["Vascular age","vage","yr"]]],
  ["Blood oxygen", [["SpO₂ avg","spo2","%"]]],
];
const OURA_T3 = [
  ["Sleep (extra)", [["Efficiency score","sc_efficiency",""],["Total sleep score","sc_total_sleep",""],["Resp rate","breath","/min"],["Restless","restless",""],["Bedtime","bstart",""],["Wake","bend",""]]],
  ["Temp + readiness", [["Temp dev","temp_dev","°C"],["Temp trend","temp_trend","°C"],["Recovery idx","rc_recovery_index",""],["Body temp","rc_body_temperature",""],["Activity bal","rc_activity_balance",""],["Sleep bal","rc_sleep_balance",""]]],
  ["Activity breakdown", [["Walk dist","walk_m","m"],["High min","high_min","m"],["Med min","med_min","m"],["Low min","low_min","m"],["Sedentary","sed_min","m"],["Resting","rest_min","m"],["Avg MET","met_min",""],["Non-wear","nonwear_min","m"]]],
  ["Cardio + O₂ detail", [["VO₂max conf","vo2_conf",""],["Breathing dist","bdi",""],["Pulse wave vel","pwv","pwv"]]],
];
const OURA_GROUP_ACCENTS = ["var(--ink)","var(--rust)","var(--taupe)","var(--grey)","var(--oura)"];

function ouraScoreColor(v){
  v = (v===''||v==null) ? null : +v;
  if(v==null || isNaN(v)) return 'var(--grey)';
  if(v>=85) return '#1d9e75';
  if(v>=70) return 'var(--ink)';
  return '#ba7517';
}
function ouraResPill(v){
  const map={strong:'#1d9e75',solid:'#1d9e75',adequate:'#8a877f',limited:'#ba7517'};
  const c = map[v] || 'var(--grey)';
  if(!v) return `<span class="oura-pill oura-miss" style="background:var(--tint)">—</span>`;
  return `<span class="oura-pill" style="background:${c}22;color:${c}">${v}</span>`;
}
function ouraStressPill(v){
  const map={normal:'#1d9e75',restored:'#1d9e75',stressful:'#ba7517'};
  const c = map[v] || 'var(--grey)';
  if(!v) return '';
  return `<span class="oura-gpill" style="background:${c}22;color:${c}">${v}</span>`;
}
function ouraHM(v){
  if(v===''||v==null) return '—';
  const m = +v; if(isNaN(m)) return v;
  return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0');
}
// PWV interpreted relative to Uday's own recent baseline (~7.5 m/s). Directional, not clinical.
function ouraPwvHint(v){
  v=+v; if(isNaN(v)) return '';
  if(v<7.45) return ' <span class="hint" style="color:#1d9e75">more elastic</span>';
  if(v>7.6)  return ' <span class="hint" style="color:#ba7517">stiffer</span>';
  return ' <span class="hint" style="color:#8a877f">typical</span>';
}
function ouraFmt(raw, unit){
  if(raw===''||raw==null) return '<span class="oura-miss">—</span>';
  if(unit==='hm') return ouraHM(raw);
  if(unit==='m')  return (raw==='0'||raw===0) ? '0m' : raw+'m';
  if(unit==='n')  { const n=+raw; return isNaN(n)?raw:n.toLocaleString(); }
  if(unit==='%')  return raw+'%';
  if(unit==='pwv')return raw+' m/s'+ouraPwvHint(raw);
  if(unit==='')   return raw;
  return raw+' '+unit;
}
function ouraGroups(rowObj, groups){
  return groups.map((g, i)=>{
    const [title, fields, pillKey] = g;
    const accent = OURA_GROUP_ACCENTS[i % OURA_GROUP_ACCENTS.length];
    const pill = pillKey ? ouraStressPill(rowObj[pillKey]) : '';
    const rowsHtml = fields.map(([label,key,unit])=>
      `<div class="oura-r"><span class="k">${label}</span><span class="val">${ouraFmt(rowObj[key], unit)}</span></div>`
    ).join('');
    return `<div class="oura-grp"><div class="oura-gt" style="color:${accent}">${title}${pill}</div><div class="oura-rows">${rowsHtml}</div></div>`;
  }).join('');
}
function ouraDayLabel(dayStr){
  // dayStr may be 'YYYY-MM-DD' (string) or a gviz Date(...) — normalise.
  let d;
  if(typeof dayStr==='string' && /^\d{4}-\d{2}-\d{2}/.test(dayStr)){
    d = new Date(dayStr+'T00:00:00');
  } else {
    const parsed = parseGvizDate(dayStr);
    d = new Date(parsed);
    if(isNaN(d)) return { dow:'', n: dayStr };
  }
  return {
    dow: d.toLocaleDateString('en-GB',{weekday:'short'}),
    n: d.getDate()+' '+d.toLocaleDateString('en-GB',{month:'short'})
  };
}
function renderOuraTable(json){
  const main = document.getElementById('mainContent');
  if(!json || !json.table || !json.table.rows || json.table.rows.length===0){
    main.innerHTML = `<div class="empty-state">No Oura data yet.</div>`;
    return;
  }
  const cols = json.table.cols.map(c=>c.label || '');
  const rowObjs = json.table.rows.map(r=>{
    const o = {};
    r.c.forEach((cell,i)=>{
      let v = cell ? (cell.f !== undefined ? cell.f : cell.v) : '';
      o[cols[i]] = (v===null||v===undefined) ? '' : v;
    });
    return o;
  });
  // gviz already sorted newest-first via the query; guard anyway.
  rowObjs.sort((a,b)=> (a.day < b.day ? 1 : a.day > b.day ? -1 : 0));

  // First time this loads, default the most recent day open.
  if(!state.ouraDefaultApplied && rowObjs.length){
    state.ouraExpanded[rowObjs[0].day] = true;
    state.ouraDefaultApplied = true;
  }

  main.innerHTML = rowObjs.map(o=>{
    const day = o.day;
    const t = ouraDayLabel(day);
    const isOpen = state.ouraExpanded[day];
    const isDeep = state.ouraDeepOpen[day];
    const sc = (label,key)=>`<div class="oura-sc"><div class="v" style="color:${ouraScoreColor(o[key])}">${(o[key]===''||o[key]==null)?'—':o[key]}</div><div class="l">${label}</div></div>`;
    return `
      <div class="oura-card ${isOpen?'open':''} ${isDeep?'deepopen':''}">
        <div class="oura-head" onclick="toggleOura('${day}')">
          <div class="oura-date"><div class="oura-dow">${t.dow}</div><div class="oura-dnum">${t.n}</div></div>
          <div class="oura-scores">${sc('sleep','sleep_score')}${sc('ready','readiness_score')}${sc('activ','activity_score')}</div>
          ${ouraResPill(o.res)}
          <span class="oura-chev">▼</span>
        </div>
        <div class="oura-body">
          ${ouraGroups(o, OURA_T1)}
          <div class="oura-grp" style="border-bottom:none">
            <button class="oura-more" onclick="toggleOuraDeep(event,'${day}')">all raw fields</button>
            <div class="oura-deep">${ouraGroups(o, OURA_T3)}</div>
          </div>
        </div>
      </div>`;
  }).join('');
}
function toggleOura(day){
  state.ouraExpanded[day] = !state.ouraExpanded[day];
  if(state.viewCache['oura']) renderOuraTable(state.viewCache['oura']);
}
function toggleOuraDeep(evt, day){
  evt.stopPropagation();
  state.ouraDeepOpen[day] = !state.ouraDeepOpen[day];
  if(state.viewCache['oura']) renderOuraTable(state.viewCache['oura']);
}

/* =========================================================
   INIT
   ========================================================= */
renderSubtabs();
renderContent();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
